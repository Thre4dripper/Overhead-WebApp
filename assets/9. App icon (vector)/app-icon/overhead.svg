<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Overhead</title>
<desc id="d">App icon for Overhead: a worm's-eye view up a canyon between two buildings, their verticals converging to a vanishing point above the canvas (512, -700), with one aircraft crossing the open sky. Reads at 48 px from three shapes only - two dark masses, the slot of sky between them, and the magenta aircraft. Safe area: all identifying content sits inside the centred circle r 410 (80% of the canvas) and clear of the corners, so round and rounded-square masks both crop only the bleeding building flanks. Full-bleed background - no transparent margin. Palette: sky #c9d6dc, near massing #1d2e44, held-back block #3e5772, aircraft #b0246e.</desc>
