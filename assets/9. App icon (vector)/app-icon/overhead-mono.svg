<title id="tm">Overhead, monochrome</title>
<desc id="dm">Monochrome silhouette of the Overhead icon for notification badges: the two near building masses and the aircraft in currentColor on a transparent ground, with the held-back canyon block dropped so nothing merges at badge size. Safe area: all identifying content sits inside the centred circle r 410 (80% of the canvas) and clear of the corners, so round and rounded-square masks both crop only the bleeding building flanks. Full-bleed background - no transparent margin.</desc>
