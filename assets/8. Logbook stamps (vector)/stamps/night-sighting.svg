<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Night sighting</title>
<desc id="d">Inked roundel with a crescent and nav lights, struck after dark. Logbook stamp, 96x96, muted palette for a buff sectional ground: ink #23384f, paper #efe7d3. Reads at 48 px from its outline and central glyph; the small caps are texture at that size.</desc>
<defs><clipPath id="body-night-sighting"><circle cx="48" cy="48" r="40"></circle></clipPath></defs>
<g transform="rotate(5 48 48)">
  <circle cx="48" cy="48" r="40" fill="#2a3448" stroke="#23384f" stroke-width="2.4"></circle>
  <circle cx="48" cy="48" r="33" stroke="#efe7d3" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3.4"></circle>
  <circle cx="44" cy="41" r="14" fill="#efe7d3" fill-opacity="0.92"></circle>
  <circle cx="53.5" cy="35.5" r="12.5" fill="#2a3448"></circle>
  <g stroke="none">
    <circle cx="33" cy="62" r="2.6" fill="#a8555f"></circle>
    <circle cx="48" cy="66" r="2.6" fill="#efe7d3" fill-opacity="0.9"></circle>
    <circle cx="63" cy="62" r="2.6" fill="#5e8b6a"></circle>
  </g>
  <g clip-path="url(#body-night-sighting)"><rect x="29.9" y="70" width="36.3" height="15" fill="#2a3448"></rect></g>
  <text x="48" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="7.5" letter-spacing="0.2em" fill="#efe7d3" fill-opacity="0.85">NIGHT</text>
</g>
<circle cx="48" cy="48" r="40" fill="none" stroke="#23384f" stroke-width="2.4"></circle>
</svg>