<title id="t">High flyer</title>
<desc id="d">Altitude placard struck for a sighting above flight level 400. Logbook stamp, 96x96, muted palette for a buff sectional ground: ink #23384f, paper #efe7d3. Reads at 48 px from its outline and central glyph; the small caps are texture at that size.</desc>
