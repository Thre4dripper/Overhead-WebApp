<title id="t">Rare type</title>
<desc id="d">Airworthiness lozenge with a burst mark, struck for an uncommon type. Logbook stamp, 96x96, muted palette for a buff sectional ground: ink #23384f, paper #efe7d3. Reads at 48 px from its outline and central glyph; the small caps are texture at that size.</desc>
