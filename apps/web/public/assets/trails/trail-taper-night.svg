<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" fill="none" role="img" aria-label="Tapering solid trail, night">
<title>Tapering solid trail - night</title>
<desc>Transparent overlay for a tilted 3D city view. The element with id &#34;trail&#34; IS the treatment; the small glyph at the head is the 2D aircraft icon foreshortened for the camera tilt.
Generated from the aircraft's last 240 s of 3D positions, projected through the view camera: sx = 360 + f * x / z, sy = 210 - f * y / z, f = 686.9 px (fovV 34 deg, shallow tilt)
Rule: half-width = 15 * age^0.95 * (1200 / z) px, offset along the screen normal; one closed outline path, fill-opacity 0.5
Ink: trail #e2589b, glyph #e7edf4. Every sample carries its own z, so the trail thins with distance as well as age.</desc>
