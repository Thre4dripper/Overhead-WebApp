<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-labelledby="t d">
<title id="t">Hundred sightings</title>
<desc id="d">Double-ring roundel struck at one hundred logged sightings. Logbook stamp, 96x96, muted palette for a buff sectional ground: ink #23384f, paper #efe7d3. Reads at 48 px from its outline and central glyph; the small caps are texture at that size.</desc>
<g transform="rotate(-4 48 48)">
  <circle cx="48" cy="48" r="40" fill="#efe7d3" stroke="#23384f" stroke-width="2.4"></circle>
  <circle cx="48" cy="48" r="34.5" stroke="#6b7355" stroke-width="2" stroke-opacity="0.85"></circle>
  <circle cx="48" cy="48" r="30" stroke="#23384f" stroke-width="0.9" stroke-opacity="0.35"></circle>
  <text x="48" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="27" font-weight="700" letter-spacing="0.01em" fill="#23384f">100</text>
</g>
</svg>