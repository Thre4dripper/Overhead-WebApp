<title id="t">Helicopter spotted</title>
<desc id="d">Hexagonal placard struck for a rotary-wing sighting. Logbook stamp, 96x96, muted palette for a buff sectional ground: ink #23384f, paper #efe7d3. Reads at 48 px from its outline and central glyph; the small caps are texture at that size.</desc>
