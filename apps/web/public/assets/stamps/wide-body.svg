<title id="t">Wide-body spotted</title>
<desc id="d">Airframe data plate with rivets, struck for a four-engine wide-body. Logbook stamp, 96x96, muted palette for a buff sectional ground: ink #23384f, paper #efe7d3. Reads at 48 px from its outline and central glyph; the small caps are texture at that size.</desc>
