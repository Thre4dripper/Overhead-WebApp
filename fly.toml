# Fly.io deployment for the API (the web app goes to Vercel). Steps in README.md → Hosting.
app = "overhead-api"           # change to your app name
primary_region = "fra"         # pick a region near you

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  AIRCRAFT_PROVIDER = "opensky"
  OPENSKY_DAILY_CREDITS = "4000"
  POLL_INTERVAL_MS = "15000"
  # set to your Vercel domain(s), comma separated
  CORS_ORIGIN = "https://overhead.vercel.app"
  AIRCRAFT_DB_CSV = "/data/aircraft-db.csv"

[[mounts]]
  source = "overhead_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"    # the poller and WebSockets need an always-on machine
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # the in-memory aircraft database needs more than 256 MB
