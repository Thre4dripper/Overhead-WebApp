# Render.com alternative for the API. The free plan sleeps when idle, which stops the poller; use "starter".
services:
  - type: web
    name: overhead-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    plan: starter
    envVars:
      - key: FEED
        value: opensky
      - key: REFRESH_SECONDS
        value: "15"
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: OPENSKY_DAILY_CREDITS
        value: "4000"
      - key: CORS_ORIGIN
        value: https://overhead-web-app-web.vercel.app
      - key: AIRCRAFT_DB_CSV
        value: /data/aircraft-db.csv
    disk:
      name: overhead-data
      mountPath: /data
      sizeGB: 1
